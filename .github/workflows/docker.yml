# Builds the inference image for linux/amd64 and linux/arm64 (Windows, Intel/Apple Silicon Macs, Linux) and publishes
# it as ghcr.io/sushruths04/neurobytes. Run it from the Actions tab (needs release v1.0).
name: docker
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build context (weights from release v1.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: CONTEXT_ONLY=1 bash docker/build.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sushruths04/neurobytes:latest,ghcr.io/sushruths04/neurobytes:c13
          labels: |
            org.opencontainers.image.source=https://github.com/Sushruths04/neurobytes
            org.opencontainers.image.description=NeuroBytes C13 EEG-to-video retrieval: inference image

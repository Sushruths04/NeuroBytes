# Builds the neurobyte-web image (the web UI, separate from the C13 inference image) for linux/amd64 and linux/arm64
# and publishes it as ghcr.io/sushruths04/neurobytes-web. Run it from the Actions tab.
name: web
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: neurobyte-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sushruths04/neurobytes-web:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Sushruths04/neurobytes
            org.opencontainers.image.description=NeuroBytes web UI: EEG-to-video retrieval results (C13)

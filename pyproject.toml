[project]
name = "mindread"
version = "0.1.0"
description = "EEG-to-video identification, SchubKI National AI Hackathon 2026 (team NeuroBytes)"
requires-python = "==3.11.*"
dependencies = ["numpy", "scipy", "scikit-learn", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
